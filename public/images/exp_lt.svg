<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(216,211,204,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="380" fill="url(#bg)"/>
  <rect width="600" height="380" fill="url(#grid)"/>
  
  <!-- Architectural Room Floorplan -->
  <rect x="80" y="60" width="440" height="260" fill="none" stroke="#d8d3cc" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 4"/>
  <rect x="120" y="90" width="200" height="130" fill="rgba(216,211,204,0.02)" stroke="#d8d3cc" stroke-width="1" stroke-opacity="0.25"/>
  <rect x="340" y="90" width="140" height="200" fill="rgba(216,211,204,0.02)" stroke="#d8d3cc" stroke-width="1" stroke-opacity="0.25"/>
  
  <!-- Lux Spatial Isoline Rings -->
  <ellipse cx="220" cy="155" rx="80" ry="50" fill="none" stroke="#d8d3cc" stroke-width="1" stroke-opacity="0.2"/>
  <ellipse cx="220" cy="155" rx="50" ry="30" fill="none" stroke="#d8d3cc" stroke-width="1" stroke-opacity="0.35"/>
  <ellipse cx="410" cy="190" rx="60" ry="70" fill="none" stroke="#d8d3cc" stroke-width="1" stroke-opacity="0.2"/>
  <ellipse cx="410" cy="190" rx="35" ry="40" fill="none" stroke="#d8d3cc" stroke-width="1" stroke-opacity="0.35"/>
  
  <!-- Fixture Nodes (L&T Luminaire Points) -->
  <circle cx="220" cy="155" r="4" fill="#d8d3cc"/>
  <circle cx="170" cy="155" r="3" fill="#d8d3cc" fill-opacity="0.6"/>
  <circle cx="270" cy="155" r="3" fill="#d8d3cc" fill-opacity="0.6"/>
  <circle cx="410" cy="140" r="3.5" fill="#d8d3cc" fill-opacity="0.8"/>
  <circle cx="410" cy="240" r="3.5" fill="#d8d3cc" fill-opacity="0.8"/>
  
  <!-- Technical Dimension Lines & Labels -->
  <line x1="80" y1="45" x2="520" y2="45" stroke="#d8d3cc" stroke-width="1" stroke-opacity="0.3"/>
  <text x="300" y="40" font-family="monospace" font-size="10" fill="#d8d3cc" fill-opacity="0.7" text-anchor="middle" letter-spacing="1.5">L&amp;T SPATIAL ANALYSIS · 500 LUX NOMINAL</text>
  <text x="95" y="305" font-family="monospace" font-size="9" fill="#d8d3cc" fill-opacity="0.5">BOM GENERATOR ENGINE v1.2</text>
  <text x="470" y="305" font-family="monospace" font-size="9" fill="#d8d3cc" fill-opacity="0.5" text-anchor="end">AUTODESK MEP PARITY</text>
</svg>