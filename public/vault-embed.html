<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aether Living Vault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090a0f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      user-select: none;
    }
    .elevation-panel {
      background: rgba(18, 19, 26, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      border-radius: 10px;
    }
    .font-mono-telemetry {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div id="aether-brain-root" style="width: 100%; height: 100%;"></div>
  <script src="js/aether-brain.bundle.js"></script>
  <script>
    if (window.AetherBrain && window.AetherBrain.mountBrain) {
      var root = document.getElementById("aether-brain-root");
      if (root && !root.hasChildNodes()) {
        window.AetherBrain.mountBrain(root);
      }
    }
  </script>
</body>
</html>
